<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Juan Agent v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Prompt:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: oklch(0.16 0.008 70);
  --bg-raised: oklch(0.195 0.009 70);
  --bg-inset: oklch(0.135 0.008 70);
  --hairline: oklch(0.28 0.01 70);
  --hairline-strong: oklch(0.38 0.012 70);
  --fg: oklch(0.96 0.008 85);
  --fg-muted: oklch(0.72 0.012 80);
  --fg-quiet: oklch(0.55 0.015 75);
  --accent: oklch(0.74 0.13 55);
  --accent-quiet: oklch(0.55 0.09 55);
  --accent-ink: oklch(0.2 0.04 55);
  --danger: oklch(0.65 0.16 25);
  --ok: oklch(0.72 0.1 150);
  --serif: 'Prompt', 'Sarabun', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --sans: 'Sarabun', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --display: 'Playfair Display', serif;
}
[data-theme="light"] {
  --bg: oklch(0.97 0.006 85);
  --bg-raised: oklch(0.995 0.004 85);
  --bg-inset: oklch(0.93 0.008 80);
  --hairline: oklch(0.87 0.01 80);
  --hairline-strong: oklch(0.76 0.012 80);
  --fg: oklch(0.22 0.01 70);
  --fg-muted: oklch(0.42 0.012 75);
  --fg-quiet: oklch(0.58 0.01 75);
  --accent: oklch(0.55 0.14 50);
  --accent-quiet: oklch(0.7 0.08 55);
  --accent-ink: oklch(0.98 0.01 80);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-size: 16px; line-height: 1.65;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'ss01', 'cv01';
}
body { min-height: 100vh; }
::selection { background: var(--accent); color: var(--accent-ink); }
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
input, textarea { font-family: inherit; color: inherit; background: none; border: none; outline: none; }
textarea { resize: none; }
.mono { font-family: var(--mono); font-feature-settings: 'ss01'; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 999px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--hairline-strong); }

/* ── App shell ─────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100vh;
  min-height: 600px;
}
.sidebar {
  background: var(--bg-inset);
  border-right: 1px solid var(--hairline);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-head {
  padding: 22px 22px 18px;
  border-bottom: 1px solid var(--hairline);
}
.brand {
  font-family: var(--serif); font-weight: 700; font-size: 24px; line-height: 1;
  letter-spacing: -0.02em; color: var(--fg);
  display: flex; align-items: center; gap: 10px;
}
.brand-mark {
  width: 32px; height: 32px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--fg); position: relative;
  transform: rotate(-3deg); background: var(--bg);
}
.brand-mark::before { content: ''; position: absolute; inset: 3px; border: 1px solid var(--accent); }
.brand-mark svg { position: relative; z-index: 1; }
.brand-accent { font-weight: 700; color: var(--accent); }
.brand-v { font-family: var(--mono); font-size: 10px; color: var(--fg-quiet); margin-left: 6px; letter-spacing: 0.12em; }
.brand-sub { margin-top: 10px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-quiet); }
.nav { padding: 14px 10px; flex: 1; overflow-y: auto; }
.nav-label { padding: 10px 12px 6px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quiet); }
.nav-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px; border-radius: 6px; color: var(--fg-muted);
  font-size: 14px; cursor: pointer; transition: background .12s, color .12s;
  width: 100%; text-align: left;
}
.nav-item:hover { background: var(--bg-raised); color: var(--fg); }
.nav-item.active { background: var(--bg-raised); color: var(--fg); }
.sidebar-foot { padding: 16px 18px; border-top: 1px solid var(--hairline); font-size: 12px; }
.quota { display: flex; flex-direction: column; gap: 8px; }
.quota-row { display: flex; align-items: baseline; justify-content: space-between; }
.quota-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quiet); }
.quota-count { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1; color: var(--fg); }
.quota-count em { font-style: normal; color: var(--fg-quiet); font-size: 14px; }
.quota-bar { height: 2px; background: var(--hairline); overflow: hidden; position: relative; }
.quota-bar-fill { height: 100%; background: var(--accent); transition: width .5s cubic-bezier(.2,.7,.2,1); }
.quota-hint { font-size: 11px; color: var(--fg-quiet); line-height: 1.4; }

/* ── Main pane ─────────────────────────────────────────── */
.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px; border-bottom: 1px solid var(--hairline);
  background: var(--bg); min-height: 56px;
}
.topbar-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.topbar-title .t1 { font-family: var(--serif); font-weight: 600; font-size: 17px; color: var(--fg); letter-spacing: -0.01em; }
.topbar-title .t2 { font-family: var(--mono); font-size: 11px; color: var(--fg-quiet); letter-spacing: 0.1em; text-transform: uppercase; }
.topbar-actions { display: flex; align-items: center; gap: 6px; }
.iconbtn { width: 32px; height: 32px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--fg-muted); transition: background .12s, color .12s; }
.iconbtn:hover { background: var(--bg-raised); color: var(--fg); }

/* ── Chat ──────────────────────────────────────────────── */
.chat-wrap { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.chat { max-width: 840px; margin: 0 auto; padding: 40px 28px 180px; }
.chat-hero { padding: 40px 0 32px; border-bottom: 1px solid var(--hairline); margin-bottom: 32px; }
.chat-hero-kicker { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-quiet); margin-bottom: 14px; }
.chat-hero h1 { font-family: var(--serif); font-weight: 700; font-size: 72px; line-height: 1.05; letter-spacing: -0.03em; margin: 0; color: var(--fg); }
.chat-hero h1 em { font-style: normal; font-weight: 400; color: var(--accent); }
.chat-hero p { margin: 18px 0 0; color: var(--fg-muted); font-size: 15px; max-width: 48ch; text-wrap: pretty; }
.starters { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); margin-top: 28px; }
.starter { background: var(--bg); padding: 18px 20px; text-align: left; transition: background .12s; display: flex; flex-direction: column; gap: 6px; min-height: 96px; cursor: pointer; }
.starter:hover { background: var(--bg-raised); }
.starter-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-quiet); }
.starter-text { color: var(--fg); font-size: 15px; line-height: 1.5; font-weight: 500; }

/* Messages — notebook variant */
.msg {
  margin-bottom: 28px; display: flex; gap: 18px; align-items: flex-start;
  position: relative; padding-left: 28px;
  border-left: 1px solid var(--hairline); margin-left: 14px;
}
.msg-gutter {
  position: absolute; left: -40px; top: 2px; width: 40px; text-align: right;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--fg-quiet);
}
.msg-body { flex: 1; min-width: 0; }
.msg-user .msg-body { color: var(--fg); }
.msg-user-bubble {
  background: transparent; border: 0;
  border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline);
  padding: 16px 0; border-radius: 0;
  color: var(--fg-muted); font-family: var(--serif);
  font-weight: 500; font-size: 20px; line-height: 1.5;
}
.msg-agent .msg-body { color: var(--fg); font-size: 16px; line-height: 1.8; }
.msg-agent .msg-body p { margin: 0 0 14px; text-wrap: pretty; }
.msg-agent .msg-body p:last-child { margin-bottom: 0; }
.msg-agent .msg-body strong { font-weight: 600; color: var(--fg); }
.msg-agent .msg-body em { color: var(--accent); font-style: italic; }

/* Process indicator */
.process {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0 14px; font-family: var(--mono);
  font-size: 11px; letter-spacing: 0.06em;
  color: var(--fg-quiet); margin-bottom: 16px;
}
.process .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); animation: pulse 1.4s infinite;
}
.process.done .dot { background: var(--fg-quiet); animation: none; }

/* Citations */
.cite-ref { font-family: var(--mono); font-size: 0.75em; color: var(--accent); vertical-align: super; cursor: pointer; margin-left: 1px; text-decoration: none; }
.cite-ref:hover { color: var(--fg); }
.citations { margin-top: 22px; padding-top: 16px; border-top: 1px dashed var(--hairline); }
.citations-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quiet); margin-bottom: 10px; }
.citation { display: flex; gap: 12px; padding: 8px 0; font-size: 12.5px; color: var(--fg-muted); line-height: 1.5; }
.citation-num { font-family: var(--mono); color: var(--accent); flex-shrink: 0; width: 22px; }
.citation-meta { font-family: var(--mono); color: var(--fg-quiet); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }

/* Feedback */
.msg-actions { display: flex; align-items: center; gap: 4px; margin-top: 14px; opacity: 0.55; transition: opacity .16s; }
.msg-agent:hover .msg-actions { opacity: 1; }
.action-btn { width: 28px; height: 28px; border-radius: 4px; color: var(--fg-quiet); display: inline-flex; align-items: center; justify-content: center; transition: background .12s, color .12s; }
.action-btn:hover { background: var(--bg-raised); color: var(--fg); }
.action-btn.on { color: var(--accent); }

/* Composer */
.composer-wrap {
  position: sticky; bottom: 0; left: 0; right: 0;
  padding: 14px 28px 22px;
  background: linear-gradient(to top, var(--bg) 72%, transparent);
  pointer-events: none;
}
.composer {
  max-width: 840px; margin: 0 auto;
  background: var(--bg-raised); border: 1px solid var(--hairline);
  border-radius: 4px; padding: 12px 14px 10px;
  pointer-events: auto; transition: border-color .12s;
}
.composer:focus-within { border-color: var(--hairline-strong); }
.composer textarea {
  width: 100%; min-height: 22px; max-height: 200px;
  font-size: 15px; line-height: 1.5; color: var(--fg); padding: 4px 2px;
}
.composer textarea::placeholder { color: var(--fg-quiet); }
.composer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.composer-meta {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--fg-quiet);
  display: flex; gap: 14px; align-items: center;
}
.send-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px; background: var(--accent); color: var(--accent-ink);
  border-radius: 3px; font-size: 13px; font-weight: 500;
  transition: transform .1s, opacity .12s;
}
.send-btn:hover { transform: translateY(-1px); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* Typing */
.typing { display: flex; gap: 4px; padding: 8px 0; }
.typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-quiet); animation: typingBounce 1.2s ease-in-out infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.15s; }
.typing-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes typingBounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

/* Streaming cursor */
.stream-cursor { animation: cursorBlink .8s step-end infinite; color: var(--accent); font-weight: 400; }
@keyframes cursorBlink { 50% { opacity: 0; } }

/* ── Response markdown styles ──────────────────────────── */
.resp-h {
  font-family: var(--serif); font-weight: 700; font-size: 17px;
  color: var(--accent); margin: 20px 0 8px; line-height: 1.3;
  letter-spacing: -0.01em;
}
.resp-h:first-child { margin-top: 4px; }
.resp-sh {
  font-family: var(--serif); font-weight: 600; font-size: 15px;
  color: var(--fg); margin: 14px 0 6px; line-height: 1.3;
}
.resp-p { margin: 0 0 10px; text-wrap: pretty; line-height: 1.8; }
.resp-p:last-child { margin-bottom: 0; }
.resp-list { margin: 4px 0 12px 4px; display: flex; flex-direction: column; gap: 5px; padding: 0; list-style: none; }
.resp-list li { line-height: 1.75; padding-left: 16px; position: relative; }
.resp-list li::before { content: '—'; position: absolute; left: 0; color: var(--accent); font-weight: 700; }
.resp-num { margin: 4px 0 12px; display: flex; flex-direction: column; gap: 6px; padding: 0; list-style: none; }
.resp-num li { display: flex; gap: 10px; line-height: 1.75; }
.resp-num li .resp-num-n { font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 700; min-width: 18px; padding-top: 3px; }
.resp-code { font-family: var(--mono); font-size: 0.86em; background: var(--bg-inset); padding: 1px 6px; border-radius: 3px; color: var(--accent); }
[data-theme="light"] .resp-h { color: var(--accent); }
[data-theme="light"] .resp-list li::before { color: var(--accent); }

/* Starter skeleton + stagger */
.starter-skeleton { background: var(--bg-raised); cursor: default; min-height: 96px; }
.starter-skeleton::after {
  content: ''; display: block; height: 10px; width: 60%; margin: 8px 0;
  background: var(--hairline-strong); border-radius: 4px;
  animation: shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }
.starter[style*="--i"] {
  opacity: 0;
  animation: fadeSlideIn 0.35s ease calc(var(--i, 0) * 120ms) forwards;
}
@keyframes fadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ── Admin Dashboard ───────────────────────────────────── */
.admin { padding: 40px 48px 60px; max-width: 1240px; margin: 0 auto; }
.admin h2 { font-family: var(--serif); font-weight: 700; font-size: 36px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 6px; }
.admin .admin-sub { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quiet); margin-bottom: 40px; }
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); margin-bottom: 48px; }
.kpi { background: var(--bg); padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 6px; }
.kpi-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quiet); }
.kpi-value { font-family: var(--serif); font-weight: 600; font-size: 36px; line-height: 1.1; color: var(--fg); letter-spacing: -0.02em; }
.kpi-value .unit { font-family: var(--mono); font-size: 13px; color: var(--fg-quiet); margin-left: 6px; letter-spacing: 0.06em; }
.kpi-delta { font-family: var(--mono); font-size: 11px; color: var(--fg-quiet); margin-top: 2px; }
.kpi-delta.up { color: var(--ok); }
.kpi-delta.warn { color: var(--accent); }
.panel { border: 1px solid var(--hairline); background: var(--bg); margin-bottom: 32px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--hairline); }
.panel-title { font-family: var(--serif); font-weight: 600; font-size: 19px; color: var(--fg); letter-spacing: -0.015em; }
.panel-meta { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quiet); }
.panel-body { padding: 22px; }

/* Budget ruler */
.ruler { position: relative; padding: 32px 0 40px; }
.ruler-track { height: 1px; background: var(--hairline-strong); position: relative; }
.ruler-fill { position: absolute; top: -3px; left: 0; height: 7px; background: var(--accent); transition: width .6s cubic-bezier(.2,.7,.2,1); }
.ruler-ticks { position: absolute; inset: 0; display: flex; justify-content: space-between; }
.ruler-tick { width: 1px; height: 9px; background: var(--hairline-strong); position: relative; top: -4px; }
.ruler-tick.major { height: 14px; top: -6px; background: var(--fg-muted); }
.ruler-labels { position: relative; margin-top: 14px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--fg-quiet); }
.ruler-cursor { position: absolute; top: -28px; transform: translateX(-50%); font-family: var(--serif); font-weight: 600; font-size: 16px; color: var(--accent); white-space: nowrap; letter-spacing: -0.01em; }
.ruler-cursor::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); top: 100%; width: 1px; height: 12px; background: var(--accent); margin-top: 2px; }
.ruler-annot { position: absolute; bottom: -2px; transform: translateX(-50%); font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--fg-quiet); text-transform: uppercase; white-space: nowrap; padding-top: 16px; }
.ruler-annot::before { content: ''; position: absolute; left: 50%; top: 0; width: 1px; height: 10px; background: var(--hairline-strong); }

/* Table */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-family: var(--mono); font-weight: 500; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-quiet); padding: 10px 14px; border-bottom: 1px solid var(--hairline); }
.table td { padding: 12px 14px; border-bottom: 1px solid var(--hairline); color: var(--fg); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tr:hover td { background: var(--bg-raised); }
.table td.mono { font-family: var(--mono); font-size: 12px; color: var(--fg-muted); }
.table td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.table .bar { height: 2px; background: var(--accent); display: block; margin-top: 4px; }
.table .pill { display: inline-block; padding: 2px 8px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--hairline); color: var(--fg-muted); border-radius: 999px; }
.table .pill.ok { color: var(--ok); border-color: color-mix(in oklch, var(--ok) 35%, var(--hairline)); }
.table .pill.warn { color: var(--accent); border-color: color-mix(in oklch, var(--accent) 35%, var(--hairline)); }

/* Spark bars */
.sparkrow { display: grid; grid-template-columns: 90px 1fr 60px; gap: 12px; align-items: center; padding: 6px 0; font-size: 12px; }
.spark-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--fg-quiet); text-transform: uppercase; }
.spark { display: flex; gap: 2px; align-items: flex-end; height: 36px; }
.spark-bar { flex: 1; background: var(--hairline-strong); min-height: 2px; }
.spark-bar.hi { background: var(--accent); }
.spark-val { font-family: var(--mono); font-size: 11px; color: var(--fg-muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Admin login */
.admin-login { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 120px 40px; min-height: 80vh; }
.admin-login h2 { font-family: var(--display); font-size: 36px; font-weight: 700; margin-bottom: 4px; }
.admin-login .admin-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-quiet); margin-bottom: 24px; }
.admin-login input { background: var(--bg-raised); border: 1px solid var(--hairline); padding: 14px 18px; font-size: 14px; width: 300px; border-radius: 2px; text-align: center; color: var(--fg); }
.admin-login input:focus { border-color: var(--accent); }
.admin-login .login-btn { padding: 12px 28px; border: 1.5px solid var(--accent); color: var(--accent); font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; transition: all .15s; }
.admin-login .login-btn:hover { background: var(--accent); color: var(--accent-ink); }
.admin-login .err { color: var(--danger); font-size: 13px; margin-top: 8px; }

/* ── Landing hero ──────────────────────────────────────── */
.landing-hero {
  position: fixed; inset: 0; background: var(--bg); color: var(--fg);
  z-index: 50; overflow: hidden; display: grid; place-items: center;
  opacity: 0; transition: opacity .6s ease;
  --px: 0; --py: 0; isolation: isolate;
}
.landing-hero.in { opacity: 1; }

/* Aurora backdrop */
.lh-aurora {
  position: absolute; inset: -20%; z-index: 0;
  filter: blur(60px) saturate(1.1); pointer-events: none;
}
.lh-aurora > div {
  position: absolute; inset: 0; border-radius: 50%;
  mix-blend-mode: screen; will-change: transform;
}
.lh-aurora-a {
  background: radial-gradient(closest-side, color-mix(in oklch, var(--accent) 45%, transparent) 0%, transparent 70%);
  transform: translate(calc(-8% + var(--px) * 20px), calc(-10% + var(--py) * 20px));
  animation: lhFloatA 22s ease-in-out infinite;
}
.lh-aurora-b {
  background: radial-gradient(closest-side, color-mix(in oklch, var(--accent) 28%, transparent) 0%, transparent 65%);
  transform: translate(calc(12% - var(--px) * 16px), calc(8% - var(--py) * 16px));
  animation: lhFloatB 28s ease-in-out infinite reverse;
}
.lh-aurora-c {
  background: radial-gradient(closest-side, oklch(0.62 0.16 20 / 0.28) 0%, transparent 60%);
  transform: translate(calc(-15% + var(--px) * 10px), calc(18% + var(--py) * 10px));
  animation: lhFloatC 34s ease-in-out infinite;
}
[data-theme="light"] .lh-aurora { filter: blur(80px) saturate(0.9); opacity: 0.45; }
@keyframes lhFloatA {
  0%,100% { transform: translate(calc(-8% + var(--px)*20px), calc(-10% + var(--py)*20px)) scale(1); }
  50%     { transform: translate(calc(-4% + var(--px)*20px), calc(-14% + var(--py)*20px)) scale(1.15); }
}
@keyframes lhFloatB {
  0%,100% { transform: translate(calc(12% - var(--px)*16px), calc(8% - var(--py)*16px)) scale(1); }
  50%     { transform: translate(calc(16% - var(--px)*16px), calc(4% - var(--py)*16px)) scale(1.12); }
}
@keyframes lhFloatC {
  0%,100% { transform: translate(calc(-15% + var(--px)*10px), calc(18% + var(--py)*10px)) scale(1); }
  50%     { transform: translate(calc(-12% + var(--px)*10px), calc(22% + var(--py)*10px)) scale(1.08); }
}

/* Grain */
.lh-grain {
  position: absolute; inset: 0; z-index: 1;
  background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxNjAnIGhlaWdodD0nMTYwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC45JyBudW1PY3RhdmVzPScyJyBzdGl0Y2hUaWxlcz0nc3RpdGNoJy8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPScwIDAgMCAwIDAgIDAgMCAwIDAgMCAgMCAwIDAgMCAwICAwIDAgMCAwLjUgMCcvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPScxMDAlJyBoZWlnaHQ9JzEwMCUnIGZpbHRlcj0ndXJsKCNuKScvPjwvc3ZnPg==");
  opacity: 0.08; mix-blend-mode: overlay; pointer-events: none;
}
[data-theme="light"] .lh-grain { opacity: 0.05; }

/* Vignette */
.lh-vignette {
  position: absolute; inset: 0; z-index: 2;
  background: radial-gradient(140% 100% at 50% 50%, transparent 45%, color-mix(in oklch, var(--bg) 85%, #000 15%) 100%);

}
[data-theme="light"] .lh-vignette {
  background: radial-gradient(140% 100% at 50% 50%, transparent 50%, color-mix(in oklch, var(--bg) 90%, #000 10%) 100%);
}

/* Corners */
.lh-corner {
  position: absolute; font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-quiet);
  z-index: 5; display: inline-flex; align-items: center; gap: 10px;
  opacity: 0; animation: lhFadeIn .8s ease .4s forwards;
}
.lh-tl { top: 28px; left: 32px; }
.lh-tr { top: 20px; right: 22px; }
.lh-bl { bottom: 28px; left: 32px; }
.lh-br { bottom: 28px; right: 32px; color: var(--accent); }
.lh-brand {
  font-family: 'Playfair Display', var(--serif); font-size: 17px; font-weight: 700;
  font-style: italic; color: var(--fg); text-transform: none; letter-spacing: -0.01em;
}
.lh-brand em { font-style: italic; color: var(--accent); }
.lh-v { font-family: var(--mono); font-size: 9px; color: var(--fg-quiet); letter-spacing: 0.18em; }
.lh-pulse {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 0 var(--accent); animation: lhPulse 2s ease-out infinite;
}
@keyframes lhPulse {
  0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--accent) 60%, transparent); }
  70% { box-shadow: 0 0 0 10px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

/* Frame hairlines */
.lh-frame-top, .lh-frame-bottom {
  position: absolute; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px; z-index: 4;
  width: min(82vw, 900px); opacity: 0; animation: lhFadeIn 1s ease .6s forwards;
}
.lh-frame-top { top: 72px; }
.lh-frame-bottom { bottom: 72px; }
.lh-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--hairline-strong), transparent); }
.lh-diamond { font-size: 8px; color: var(--accent); letter-spacing: 0; transform: translateY(-0.5px); }

/* Stage */
.lh-stage {
  position: relative; z-index: 3; display: flex; flex-direction: column;
  align-items: center; text-align: center; padding: 0 40px;
  max-width: min(92vw, 1000px);
  transform: translateY(calc(var(--py) * -6px));
  transition: transform .4s cubic-bezier(.2,.7,.2,1);
}

/* Overline */
.lh-overline {
  display: flex; align-items: center; gap: 14px; width: 100%;
  max-width: 440px; margin-bottom: 28px; opacity: 0;
  animation: lhFadeIn .9s ease .3s forwards;
}
.lh-overline-rule { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--hairline-strong), transparent); }
.lh-overline-text { font-family: var(--mono); font-size: 10px; letter-spacing: 0.36em; text-transform: uppercase; color: var(--fg-muted); white-space: nowrap; }

/* Wordmark */
.lh-wordmark {
  font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic;
  font-size: clamp(84px, 13vw, 180px); line-height: 0.9; letter-spacing: -0.035em;
  margin: 0; color: var(--fg); display: flex; align-items: baseline;
  gap: clamp(14px, 2vw, 28px); user-select: none;
  transform: translateX(calc(var(--px) * 8px));
  transition: transform .5s cubic-bezier(.2,.7,.2,1);
}
.lh-word { display: inline-flex; align-items: baseline; }
.lh-word-juan { color: var(--accent); }
.lh-glyph {
  display: inline-block; opacity: 0;
  transform: translateY(.5em) scale(1.06); filter: blur(10px);
  animation: lhGlyphIn .9s cubic-bezier(.2,.7,.2,1) forwards;
  animation-delay: calc(0.08s * var(--i) + .2s);
}
@keyframes lhGlyphIn { to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
.lh-amp {
  font-family: 'Playfair Display', serif; font-style: italic; font-weight: 400;
  font-size: 0.4em; color: var(--accent); transform: translateY(-0.35em);
  opacity: 0; animation: lhFadeIn .6s ease .55s forwards;
}

/* Thai subtitle */
.lh-thai {
  margin-top: 12px; font-family: var(--serif); font-weight: 500;
  font-size: clamp(14px, 1.4vw, 17px); letter-spacing: 0.6em;

  animation: lhFadeIn 1s ease 1s forwards;
}

/* Tagline */
.lh-tagline {

}
.lh-tag-accent { color: var(--fg); font-weight: 700; position: relative; }
.lh-tag-accent::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -3px;
  height: 2px; background: var(--accent); transform: scaleX(0);
  transform-origin: left; animation: lhScaleX 1.1s cubic-bezier(.7,0,.2,1) 1.6s forwards;
}
@keyframes lhScaleX { to { transform: scaleX(1); } }

/* CTA */
.lh-cta {
  position: relative; margin-top: 52px; display: inline-flex;
  align-items: center; gap: 12px; padding: 20px 38px;
  background: transparent; color: var(--fg);
  font-family: var(--serif); font-size: 17px; font-weight: 600;
  letter-spacing: 0.01em; border: 1.5px solid var(--fg);
  cursor: pointer;
  transition: color .3s ease, transform .2s cubic-bezier(.2,.7,.2,1), border-color .3s;
  opacity: 0; animation: lhCtaIn .9s cubic-bezier(.2,.7,.2,1) 1.45s forwards;
  overflow: hidden; isolation: isolate;
}
@keyframes lhCtaIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.lh-cta::before {
  content: ""; position: absolute; inset: 0; background: var(--fg);
  transform: translateY(101%); transition: transform .38s cubic-bezier(.7,0,.2,1); z-index: -1;
}
.lh-cta:hover { color: var(--bg); border-color: var(--fg); transform: translateY(-2px); }
.lh-cta:hover::before { transform: translateY(0); }
.lh-cta:active { transform: translateY(0); }
.lh-cta-glow {
  position: absolute; inset: -2px; border-radius: inherit;
  background: radial-gradient(closest-side, color-mix(in oklch, var(--accent) 55%, transparent), transparent 72%);
  filter: blur(18px); opacity: 0; transition: opacity .4s; z-index: -2;
  animation: lhBreathe 3s ease-in-out infinite;
}
.lh-cta:hover .lh-cta-glow { opacity: 1; }
@keyframes lhBreathe { 0%,100% { opacity: 0.35; } 50% { opacity: 0.55; } }
.lh-cta-bracket {
  font-family: 'Playfair Display', serif; font-style: italic; color: var(--accent);
  font-weight: 400; font-size: 1.2em; transition: transform .3s;
}
.lh-cta:hover .lh-cta-bracket:first-child { transform: translateX(-2px); }
.lh-cta:hover .lh-cta-bracket:last-child { transform: translateX(2px); }
.lh-cta-label { position: relative; z-index: 1; }
.lh-cta-arrow { display: inline-flex; transition: transform .3s cubic-bezier(.2,.7,.2,1); }
.lh-cta:hover .lh-cta-arrow { transform: translateX(5px); }

/* Hint */
.lh-hint {
  margin-top: 22px; font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.24em; text-transform: uppercase; color: var(--fg-quiet);
  display: inline-flex; align-items: center; gap: 12px; opacity: 0;
  animation: lhFadeIn 1s ease 1.7s forwards;
}
.lh-hint i { font-style: normal; color: var(--accent); opacity: .8; }

@keyframes lhFadeIn { to { opacity: 1; } }
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .lh-aurora-a, .lh-aurora-b, .lh-aurora-c, .lh-pulse, .lh-cta-glow { animation: none !important; }
  .lh-glyph { transition: none; animation: none; opacity: 1; transform: none; filter: none; }
}

/* Responsive */
@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .kpi-row { grid-template-columns: 1fr 1fr; }
  .starters { grid-template-columns: 1fr; }
  .lh-corner { font-size: 9px; letter-spacing: 0.14em; }
  .lh-bl, .lh-br { max-width: 44%; }
  .lh-frame-top { top: 56px; }
  .lh-frame-bottom { bottom: 56px; }
  .lh-stage { padding: 0 20px; }
  .lh-wordmark { gap: 8px; }
  .lh-overline-text { font-size: 9px; letter-spacing: 0.24em; }
  .lh-thai { letter-spacing: 0.4em; }
}
@media (max-height: 680px) {
  .lh-frame-top, .lh-frame-bottom { display: none; }
  .lh-wordmark { font-size: clamp(60px, 10vw, 120px); }
  .lh-cta { margin-top: 36px; }
  .lh-tagline { margin-top: 22px; }
}
  </style>
</head>
<body>
<div id="root"></div>
<script>
// Auto-detect base path: works at / locally and /dj_project behind proxy
const API = window.location.pathname.replace(/\/$/, '');
const DON_LETTERS = ['D','o','n'];
const JUAN_LETTERS = ['J','u','a','n'];

function newSessionId() { return 'sess_' + Math.random().toString(36).slice(2, 10); }

let state = {
  view: 'landing',
  messages: [],
  loading: false,
  userId: localStorage.getItem('dj_user_id') || ('user_' + Math.random().toString(36).slice(2,8)),
  sessionId: newSessionId(),  // fresh every page load, not persisted
  quota: { remaining: 20, daily_limit: 20, queries_today: 0 },
  theme: localStorage.getItem('dj_theme') || 'dark',
  suggestions: null,
};
localStorage.setItem('dj_user_id', state.userId);

function setTheme(t) {
  state.theme = t;
  document.documentElement.dataset.theme = t;
  localStorage.setItem('dj_theme', t);
  render();
}
document.documentElement.dataset.theme = state.theme;

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function fetchQuota() {
  try {
    const r = await fetch(API + '/usage/' + state.userId);
    if (r.ok) { state.quota = await r.json(); render(); }
  } catch(e) {}
}

async function sendMessage(text) {
  state.messages.push({ role: 'user', text });
  state.messages.push({ role: 'agent', text: '', streaming: true });
  state.loading = true;
  render(); scrollChat();

  const startTs = Date.now();

  try {
    const resp = await fetch(API + '/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: state.userId, message: text, session_id: state.sessionId }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop(); // keep incomplete line
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch { continue; }
        if (data.text) {
          state.messages[state.messages.length - 1].text += data.text;
          updateStreamingMsg();
          scrollChat();
        }
        if (data.done) {
          // Ensure minimum visible delay of 500ms before finalising
          const elapsed = Date.now() - startTs;
          if (elapsed < 500) await new Promise(r => setTimeout(r, 500 - elapsed));
          state.messages[state.messages.length - 1].streaming = false;
          state.quota.remaining = data.remaining_quota ?? state.quota.remaining;
          state.quota.queries_today = state.quota.daily_limit - state.quota.remaining;
          state.loading = false;
          render(); scrollChat();
        }
        if (data.error) {
          state.messages[state.messages.length - 1].text = data.error;
          state.messages[state.messages.length - 1].streaming = false;
          state.loading = false;
          render();
        }
      }
    }
  } catch(e) {
    state.messages[state.messages.length - 1].text = 'API server unavailable';
    state.messages[state.messages.length - 1].streaming = false;
    state.loading = false;
    render();
  }
}

function updateStreamingMsg() {
  const bodies = document.querySelectorAll('.msg-agent .msg-body');
  if (!bodies.length) return;
  const last = bodies[bodies.length - 1];
  const m = state.messages[state.messages.length - 1];
  if (m && m.streaming) {
    last.innerHTML = formatResponse(m.text) + '<span class="stream-cursor">▊</span>';
  }
}

function scrollChat() {
  setTimeout(() => {
    const el = document.querySelector('.chat-wrap');
    if (el) el.scrollTop = el.scrollHeight;
  }, 60);
}

function inlineFmt(t) {
  return t
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code class="resp-code">$1</code>');
}

function formatResponse(text) {
  if (!text) return '';
  const lines = text.split('\n');
  const out = [];
  let listBuf = [];   // bullet list buffer
  let numBuf = [];    // numbered list buffer

  function flushList() {
    if (listBuf.length) {
      out.push('<ul class="resp-list">' + listBuf.map(l => `<li>${l}</li>`).join('') + '</ul>');
      listBuf = [];
    }
    if (numBuf.length) {
      out.push('<ol class="resp-num">' + numBuf.map(([n,l]) =>
        `<li><span class="resp-num-n">${n}.</span><span>${l}</span></li>`).join('') + '</ol>');
      numBuf = [];
    }
  }

  for (const raw of lines) {
    const line = raw.trimEnd();

    // ### sub-heading
    if (/^###\s/.test(line)) {
      flushList();
      out.push(`<h4 class="resp-sh">${inlineFmt(line.slice(4))}</h4>`);
    }
    // ## heading  →  accent colour
    else if (/^##\s/.test(line)) {
      flushList();
      out.push(`<h3 class="resp-h">${inlineFmt(line.slice(3))}</h3>`);
    }
    // # heading
    else if (/^#\s/.test(line)) {
      flushList();
      out.push(`<h3 class="resp-h">${inlineFmt(line.slice(2))}</h3>`);
    }
    // numbered list  1. / 2. …
    else if (/^\d+\.\s/.test(line)) {
      if (listBuf.length) flushList();
      const m = line.match(/^(\d+)\.\s(.*)/);
      numBuf.push([m[1], inlineFmt(m[2])]);
    }
    // bullet list  - / * / •
    else if (/^[-*•]\s/.test(line)) {
      if (numBuf.length) flushList();
      listBuf.push(inlineFmt(line.slice(2)));
    }
    // empty line
    else if (line.trim() === '') {
      flushList();
      out.push('<br>');
    }
    // normal paragraph
    else {
      flushList();
      out.push(`<p class="resp-p">${inlineFmt(line)}</p>`);
    }
  }
  flushList();
  return out.join('');
}

function submitChat() {
  const ta = document.getElementById('chatTA');
  if (!ta || !ta.value.trim() || state.loading) return;
  sendMessage(ta.value.trim());
}

/* ── Glyph wordmark builder ── */
function glyphs(letters, cls) {
  return '<span class="lh-word ' + (cls||'') + '">' +
    letters.map((ch, i) =>
      '<span class="lh-glyph" style="--i:' + i + '">' + ch + '</span>'
    ).join('') + '</span>';
}

/* ── Landing ── */
function renderLanding() {
  return `
  <div class="landing-hero" id="landingHero">
    <div class="lh-aurora">
      <div class="lh-aurora-a"></div>
      <div class="lh-aurora-b"></div>
      <div class="lh-aurora-c"></div>
    </div>
    <div class="lh-grain"></div>
    <div class="lh-vignette"></div>

    <div class="lh-corner lh-tl">
      <span class="lh-brand"><em>Don</em>Juan</span>
      <span class="lh-v">V2</span>
    </div>
    <div class="lh-corner lh-tr">
      <button class="iconbtn" onclick="setTheme(state.theme==='dark'?'light':'dark')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="lh-corner lh-bl">
      <span class="lh-pulse"></span>
      <span>EST &middot; MMXXVI &middot; BANGKOK</span>
    </div>
    <div class="lh-corner lh-br">No 001 &mdash; THE ART OF BECOMING</div>

    <div class="lh-frame-top"><span class="lh-line"></span><span class="lh-diamond">&loz;</span><span class="lh-line"></span></div>
    <div class="lh-frame-bottom"><span class="lh-line"></span><span class="lh-diamond">&loz;</span><span class="lh-line"></span></div>

    <div class="lh-stage" id="lhStage">
      <div class="lh-overline">
        <span class="lh-overline-rule"></span>
        <span class="lh-overline-text">A &middot; SELF &middot; DEVELOPMENT &middot; AGENT</span>
        <span class="lh-overline-rule"></span>
      </div>
      <h1 class="lh-wordmark">
        ${glyphs(DON_LETTERS)}
        <span class="lh-amp">&amp;</span>
        ${glyphs(JUAN_LETTERS, 'lh-word-juan')}
      </h1>
      <div class="lh-thai">&#3604;&#3629;&#3609;&#3630;&#3623;&#3609;</div>
      <div class="lh-tagline">
        <span>&#3649;&#3585;&#3656;&#3609;&#3649;&#3607;&#3657;&#3588;&#3639;&#3629;</span>
        <span class="lh-tag-accent">&#3585;&#3634;&#3619;&#3614;&#3633;&#3602;&#3609;&#3634;&#3605;&#3633;&#3623;&#3648;&#3629;&#3591;</span>
      </div>
      <button class="lh-cta" onclick="enterChat()">
        <span class="lh-cta-glow"></span>
        <span class="lh-cta-bracket">[</span>
        <span class="lh-cta-label">&#3648;&#3619;&#3636;&#3656;&#3617;&#3651;&#3594;&#3657;&#3591;&#3634;&#3609;</span>
        <span class="lh-cta-arrow">&rarr;</span>
        <span class="lh-cta-bracket">]</span>
      </button>
      <div class="lh-hint">
        <span>&#3615;&#3619;&#3637;</span><i>&middot;</i>
        <span>20 &#3588;&#3635;&#3606;&#3634;&#3617;/&#3623;&#3633;&#3609;</span><i>&middot;</i>
        <span>&#3652;&#3617;&#3656;&#3605;&#3657;&#3629;&#3591;&#3626;&#3617;&#3633;&#3588;&#3619;</span>
      </div>
    </div>
  </div>`;
}

function enterChat() {
  const hero = document.getElementById('landingHero');
  if (hero) { hero.style.opacity = '0'; hero.style.pointerEvents = 'none'; }
  fetchSuggestions(); // start prefetching immediately, don't await
  setTimeout(() => { state.view = 'chat'; fetchQuota(); render(); }, 500);
}

async function fetchSuggestions() {
  try {
    const r = await fetch(API + '/suggestions');
    if (r.ok) {
      const data = await r.json();
      state.suggestions = data.suggestions;
      if (state.view === 'chat' && state.messages.length === 0) render();
    }
  } catch(e) {}
}

/* ── Starters ── */
function renderStarters() {
  if (!state.suggestions) {
    return `<div class="starters">
      ${[0,1,2,3].map(() => '<button class="starter starter-skeleton" disabled></button>').join('\n      ')}
    </div>`;
  }
  return `<div class="starters">
    ${state.suggestions.map((s, i) =>
      `<button class="starter" style="--i:${i}" data-msg="${esc(s.text)}" onclick="sendMessage(this.dataset.msg)">
        <div class="starter-label">${esc(s.label)}</div>
        <div class="starter-text">${esc(s.text)}</div>
      </button>`
    ).join('\n    ')}
  </div>`;
}

/* ── Chat ── */
function renderChat() {
  const quotaPct = ((state.quota.daily_limit - state.quota.remaining) / state.quota.daily_limit * 100).toFixed(0);
  const msgs = state.messages.map(m => {
    if (m.role === 'user') return `<div class="msg msg-user"><div class="msg-gutter">YOU</div><div class="msg-body"><div class="msg-user-bubble">${esc(m.text)}</div></div></div>`;
    return `<div class="msg msg-agent"><div class="msg-gutter">DJ</div><div class="msg-body">${formatResponse(m.text)}</div></div>`;
  }).join('');

  const hero = state.messages.length === 0 ? `
    <div class="chat-hero">
      <div class="chat-hero-kicker">COACHING SESSION</div>
      <h1>&#3606;&#3634;&#3617;&#3604;&#3629;&#3609;<em>&#3630;&#3623;&#3609;</em></h1>
      <p>Self-esteem &#3617;&#3634;&#3585;&#3656;&#3629;&#3609;&#3607;&#3640;&#3585;&#3629;&#3618;&#3656;&#3634;&#3591; &#3606;&#3657;&#3634;&#3617;&#3637;&#3648;&#3619;&#3639;&#3656;&#3629;&#3591;&#3652;&#3627;&#3609;&#3588;&#3657;&#3634;&#3591;&#3588;&#3634;&#3651;&#3592; &#3606;&#3634;&#3617;&#3617;&#3634;&#3648;&#3621;&#3618;</p>
      ${renderStarters()}
    </div>` : '';

  const typing = state.loading ? '<div class="msg msg-agent"><div class="msg-gutter">DJ</div><div class="msg-body"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div>' : '';

  return `<div class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
              <path d="M4 4 L20 20 M4 20 L20 4" stroke="var(--accent)"/>
              <circle cx="12" cy="12" r="4.5" fill="var(--bg)" stroke="currentColor"/>
            </svg>
          </span>
          <span>&#3604;&#3629;&#3609;<span class="brand-accent">&#3630;&#3623;&#3609;</span><span class="brand-v">v2</span></span>
        </div>
        <div class="brand-sub">THE ART &middot; OF &middot; BECOMING</div>
      </div>
      <nav class="nav">
        <div class="nav-label">NAVIGATE</div>
        <button class="nav-item active"><span>Chat</span></button>
        <div class="nav-label" style="margin-top:14px">HOME</div>
        <button class="nav-item" onclick="state.view='landing'; render();"><span>&larr; &#3585;&#3621;&#3633;&#3610;&#3627;&#3609;&#3657;&#3634;&#3649;&#3619;&#3585;</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="quota">
          <div class="quota-row">
            <span class="quota-label">Today's quota</span>
            <span class="quota-count">${state.quota.remaining}<em>/${state.quota.daily_limit}</em></span>
          </div>
          <div class="quota-bar"><div class="quota-bar-fill" style="width:${quotaPct}%"></div></div>
          <div class="quota-hint">&#3648;&#3627;&#3621;&#3639;&#3629; ${state.quota.remaining} &#3588;&#3635;&#3606;&#3634;&#3617; &middot; &#3619;&#3637;&#3648;&#3595;&#3655;&#3605;&#3605;&#3629;&#3609;&#3648;&#3607;&#3637;&#3656;&#3618;&#3591;&#3588;&#3639;&#3609;</div>
        </div>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="topbar-title"><span class="t1">&#3604;&#3629;&#3609;&#3630;&#3623;&#3609;</span><span class="t2">COACHING &middot; SESSION</span></div>
        <div class="topbar-actions">
          <button class="iconbtn" onclick="state.messages=[]; state.sessionId=newSessionId(); render();" title="New chat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="iconbtn" onclick="setTheme(state.theme==='dark'?'light':'dark')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </div>
      <div class="chat-wrap"><div class="chat">${hero}${msgs}${typing}</div></div>
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="chatTA" rows="1" placeholder="&#3606;&#3634;&#3617; DJ &#3652;&#3604;&#3657;&#3648;&#3621;&#3618;..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitChat();}"></textarea>
          <div class="composer-row">
            <div class="composer-meta">
              <span>GPT-4O-MINI</span>
              <span>&#3648;&#3627;&#3621;&#3639;&#3629; ${state.quota.remaining} &#3588;&#3635;&#3606;&#3634;&#3617;</span>
            </div>
            <button class="send-btn" onclick="submitChat()" ${state.loading?'disabled':''}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              <span>&#3626;&#3656;&#3591;</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ── Render ── */
function render() {
  const root = document.getElementById('root');
  if (state.view === 'landing') {
    root.innerHTML = renderLanding();
    requestAnimationFrame(() => {
      const hero = document.getElementById('landingHero');
      if (hero) hero.classList.add('in');
    });
    initParallax();
  } else {
    root.innerHTML = renderChat();
    const ta = document.getElementById('chatTA');
    if (ta && !state.loading) ta.focus();
    // Auto-resize textarea
    if (ta) {
      ta.addEventListener('input', () => {
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
      });
    }
  }
}

/* ── Parallax ── */
function initParallax() {
  const hero = document.getElementById('landingHero');
  if (!hero) return;
  hero.addEventListener('pointermove', e => {
    const rect = hero.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width * 2 - 1;
    const py = (e.clientY - rect.top) / rect.height * 2 - 1;
    hero.style.setProperty('--px', px.toFixed(3));
    hero.style.setProperty('--py', py.toFixed(3));
  });
}

// Init
render();
fetchQuota();
</script>
</body>
</html>
