[project]
name = "dj-agent-v2"
version = "1.0.0"
description = "Don Juan Dating Coach Agent — Microsoft Agent Framework + FastAPI + Streamlit"
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core==1.0.0",
    "agent-framework-openai==1.0.0",
    "agent-framework-redis==1.0.0b260402",
    "agent-framework-devui==1.0.0b260402",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "numpy>=1.26.0",
    "openai>=1.109.1",
    "python-dotenv",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "streamlit>=1.40.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "locust>=2.20",
]

[tool.uv]
prerelease = "allow"
